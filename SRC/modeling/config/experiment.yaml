# ===========================================================================
# ABLASYON DENEY KONFIGURASYONU  (SYZ2026 / MedicalVision)
# ===========================================================================
# Her eksende "acik" degerlerin kartezyen carpimi -> calistirilacak kosular.
# Uyumsuz kombinasyonlar (ör. KNN + focal_loss) runner tarafindan otomatik atlanir.
#
# Iki profil vardir:
#   profile: subset  -> hizli uctan-uca dogrulama (smoke test)
#   profile: full    -> tam ablasyon matrisi
# Aktif profil "active_profile" ile secilir.
# ===========================================================================

active_profile: first_pass

# Tum kosular icin ortak ayarlar -------------------------------------------
common:
  seed: 42
  # Klinik hold-out test seti: %80 benign (0) / %20 pathogenic (1)
  test:
    benign_frac: 0.80
    size: 0.20                  # panelin bu orani teste ayrilir (frozen, ust sinir)
    train_benign_keep_frac: 0.50  # benign havuzunun en az bu kadari TRAIN'de kalir
    balanced_panels: [CFTR]     # bu paneller %80/20 yerine DENGELI (50/50) %20 test alir
                                # (benign cok kit; klinik oran test'i asiri kucultuyor)
  # Karar esigi optimizasyonu hangi metrige gore yapilsin
  threshold_metric: macro_f1   # mcc | macro_f1
  ablation_mode: ofat          # ofat (baseline + her bayrak tek tek) | full (2^N)
  prior_aware_threshold: true  # esigi test prior'ina (%80 benign) gore kalibre et
  clustering_balance_panels: [CFTR]  # bu panellerde clustering, azinlik (benign) sinifini
                                     # gercek MASTER varyantlariyla ~1:1'e dengeler (overshoot yok)
  explain: false               # SHAP/onem matris sirasinda KAPALI (hiz); kazananlar icin sonra
  hpo_n_iter: 5                # HPO deneme sayisi (hiz icin dusuk; odakli aramada kazanan icin artirilabilir)
  parallel_runs: 8             # ayni anda kac kosu (cok cekirdek); 1 = sirali
  model_n_jobs: 1              # paralel modda her modelin cekirdegi (asiri abonelik onlemi)
  # Repeated Stratified K-Fold
  cv:
    n_splits: 5
    n_repeats: 2
  results_dir: SRC/Result/runs

# ---------------------------------------------------------------------------
profiles:

  cftr_shap:
    panels:    [CFTR]
    scenarios: [ek-standard_median]
    models:    [extra_trees]
    hpo:       [random]
    data_aug:  [transfer_learning]
    ablation:
      focal_loss:        ["off"]
      feature_selection: ["off"]
      class_weight:      ["on"]
      l2:                ["off"]
      smote:             ["off"]
      feature_subsample: ["off"]
      row_subsample:     ["off"]
      early_stopping:    ["off"]

  pah_clustering:
    panels:    [PAH]
    scenarios: [ek-standard_median, ek-standard_nan]
    models:    [xgboost, lightgbm, random_forest, extra_trees,
                adaboost, knn, logreg]
    hpo:       [random]
    data_aug:  [clustering]
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off", "on"]
      class_weight:      ["off", "on"]
      l2:                ["off", "on"]
      smote:             ["off", "on"]
      feature_subsample: ["off", "on"]
      row_subsample:     ["off", "on"]
      early_stopping:    ["off", "on"]

  subset:
    panels:    [CFTR]
    scenarios: [ek-standard_median, ek-standard_nan]
    models:    [xgboost, lightgbm, logreg]
    hpo:       [random]                 # grid | random | bayesian
    data_aug:  [original]               # original|clustering|synthetic|clustering+synthetic|transfer_learning
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off"]
      class_weight:      ["off"]
      l2:                ["off"]
      smote:             ["off"]
      feature_subsample: ["off"]
      row_subsample:     ["off"]
      early_stopping:    ["off", "on"]

  # B: hizli ilk-gecis (tum panel+model, 2 senaryo, 3 data_aug, random HPO, OFAT)
  first_pass:
    panels:    [CFTR, KANSER, PAH, MASTER]
    scenarios: [ek-standard_median, ek-standard_nan]
    models:    [xgboost, lightgbm, random_forest, extra_trees,
                adaboost, knn, logreg]
    # catboost, svm: yavas (CatBoost ~70s, MASTER-SVM cok yavas) -> A'da
    hpo:       [random]
    data_aug:  [original, clustering, transfer_learning]
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off", "on"]
      class_weight:      ["off", "on"]
      l2:                ["off", "on"]
      smote:             ["off", "on"]
      feature_subsample: ["off", "on"]
      row_subsample:     ["off", "on"]
      early_stopping:    ["off", "on"]

  full:
    panels:    [CFTR, KANSER, PAH, MASTER]
    scenarios: [ek-standard_median, ek-standard_nan, ek-robust_median, ek-robust_nan]
    models:    [xgboost, lightgbm, catboost, random_forest, extra_trees,
                adaboost, svm, knn, logreg]
    # tabnet, tabpfn: implement edilince eklenecek
    # ensemble (voting, stacking) tam matristen SONRA eklenecek
    hpo:       [bayesian]
    data_aug:  [original, clustering, synthetic, clustering+synthetic, transfer_learning]
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off", "on"]
      class_weight:      ["off", "on"]
      l2:                ["off", "on"]
      smote:             ["off", "on"]
      feature_subsample: ["off", "on"]
      row_subsample:     ["off", "on"]
      early_stopping:    ["off", "on"]

  # CatBoost'u first_pass ile BIREBIR ayni eksenlerde (karsilastirilabilir) calistirir.
  # Ayni results_dir'e --fresh OLMADAN kosulur -> mevcut 7 modelin yanina eklenir.
  # Komut: python SRC/modeling/runner.py --profile catboost
  catboost:
    panels:    [CFTR, KANSER, PAH, MASTER]
    scenarios: [ek-standard_median, ek-standard_nan]
    models:    [catboost]
    hpo:       [random]
    data_aug:  [original, clustering, transfer_learning]
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off", "on"]
      class_weight:      ["off", "on"]
      l2:                ["off", "on"]
      smote:             ["off", "on"]
      feature_subsample: ["off", "on"]
      row_subsample:     ["off", "on"]
      early_stopping:    ["off", "on"]

  # PAH'a odakli GENISLETILMIS arama (en zayif panel). first_pass'in DISINDAKI
  # eksenleri dener: ROBUST olcekleme + bayesian HPO + synthetic/clustering+synthetic.
  # Ayni results_dir'e --fresh OLMADAN -> yeni (bayesian) run_id'ler eklenir.
  # Sonra recompute_auc.py ile cv_auc guncellenip cv-AUC ile yeniden secilir.
  # CFTR'yi DENGELI clustering (gercek benign ekleme) ile yeniden calistirir.
  # Ayri results_dir'e --fresh ile kosulur, sonra cv_auc ile mevcut sampiyona kiyaslanir.
  cftr_balanced:
    panels:    [CFTR]
    scenarios: [ek-standard_median, ek-standard_nan]
    models:    [xgboost, lightgbm, random_forest, extra_trees, adaboost, knn, logreg, catboost]
    hpo:       [random]
    data_aug:  [original, clustering, transfer_learning]
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off", "on"]
      class_weight:      ["off", "on"]
      l2:                ["off", "on"]
      smote:             ["off", "on"]
      feature_subsample: ["off", "on"]
      row_subsample:     ["off", "on"]
      early_stopping:    ["off", "on"]

  improve_pah:
    panels:    [PAH]
    scenarios: [ek-standard_median, ek-standard_nan]  # robust agac modellerinde gereksiz
    models:    [extra_trees, random_forest, lightgbm, catboost]  # PAH'in en iyi 4 agaci
    hpo:       [random]
    data_aug:  [original, clustering, synthetic, clustering+synthetic, transfer_learning]
    ablation:
      focal_loss:        ["off", "on"]
      feature_selection: ["off", "on"]
      class_weight:      ["off", "on"]
      l2:                ["off", "on"]
      smote:             ["off", "on"]
      feature_subsample: ["off", "on"]
      row_subsample:     ["off", "on"]
      early_stopping:    ["off", "on"]
